name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      # Public test-only material, exactly 32 ASCII bytes. Never reuse it in a
      # deployed environment.
      SESSION_SIGNING_KEY: "ieoga-ci-only-session-key-000001"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject production dependency vulnerabilities
        run: npm run audit:production

      - name: Validate submission evidence contracts
        run: node scripts/submission-gate.mjs --structure-only

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production worker
        run: npm run build

      - name: Run unit and contract tests
        run: npm run test:unit

      - name: Enforce coverage thresholds
        run: npm run test:coverage

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run viewport, keyboard, and accessibility tests
        run: npm run test:e2e

      - name: Run mobile Lighthouse quality budgets
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json

      - name: Run desktop Lighthouse quality budgets
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.desktop.json

      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-quality-diagnostics
          path: |
            playwright-report
            test-results
            .lighthouseci
          if-no-files-found: ignore
          retention-days: 7
