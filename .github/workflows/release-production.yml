name: Release production worker

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: production-worker-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'DONGJUN92/tour_data_webapp_Ieoga' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    env:
      CI: "true"
      # Build/test-only material; the deployed secret remains in Cloudflare and
      # is preserved by --keep-vars. Never expose the production signing key to
      # the build process.
      SESSION_SIGNING_KEY: "ieoga-release-build-only-key-001"

    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.21.0"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source and production dependencies
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          npm run audit:production
          npm run typecheck
          npm run lint

      # This is the only production build in the job. Every later step hashes,
      # tests, deploys, and attests these exact dist directories.
      - name: Build the production worker once
        run: npm run build

      - name: Enforce coverage and contract thresholds against the single build
        run: npm run test:coverage

      - name: Validate submission evidence structure
        run: npm run evidence:structure

      - name: Install the pinned browser runtime
        run: npx --no-install playwright install --with-deps chromium

      - name: Run all four viewport, keyboard, and accessibility projects
        run: npm run test:e2e

      - name: Canonically hash the exact worker and static assets
        run: >-
          node scripts/release-identity.mjs prepare
          --commit "$GITHUB_SHA"
          --output outputs/release/prepared-build.json
          --bundle-manifest outputs/release/worker-bundle-manifest.json
          --asset-manifest outputs/release/static-asset-manifest.json

      - name: Apply additive production D1 migrations
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          npx --no-install wrangler d1 migrations apply site-creator-d1
          --remote
          --config wrangler.jsonc

      # 런타임 구성은 이 명령의 `--var`가 유일한 출처다. 대시보드에서 값을
      # 바꾸지 말 것 — 여기 적힌 값이 매 배포마다 원격을 덮는다.
      #
      # `--strict`는 뺐다. 이 플래그는 **설정 파일**과 원격을 대조하는데
      # `--var`로 넘긴 값은 그 비교에 들어가지 않는다. 그래서 `--var`로 세운
      # 값이 원격에 남는 순간(첫 배포 직후) 설정 파일에는 없고 원격에는 있는
      # 상태가 되어, 이후 모든 배포가 "원격에서 지워질 값이 있다"며 중단됐다.
      # 값을 설정 파일로 옮기면 이번에는 동적인 DEPLOYMENT_COMMIT_SHA가 같은
      # 이유로 충돌한다. 즉 `--var`로 구성을 관리하는 한 이 플래그와는 공존할
      # 수 없다.
      #
      # 대신 `--keep-vars`를 남겨 원격의 다른 값이 지워지지 않게 하고, 구성
      # 차이는 wrangler가 로그에 그대로 출력하므로 배포 로그에서 확인할 수
      # 있다. 배포 자체도 main 브랜치에서 이 워크플로로만 일어난다.
      - name: Deploy the exact no-bundle artifact at 100 percent
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          npx --no-install wrangler deploy dist/server/index.js \
            --config dist/server/wrangler.json \
            --no-bundle \
            --assets dist/client \
            --tag "$GITHUB_SHA" \
            --message "GitHub Actions release $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" \
            --var "DEPLOYMENT_COMMIT_SHA:$GITHUB_SHA" \
            --var "ROUTING_BASE_URL:none" \
            --var "WEATHER_API_URL:none" \
            --var "REVERSE_GEOCODE_URL:none" \
            --var "FORWARD_GEOCODE_URL:none" \
            --keep-vars

      - name: Bind runtime metadata and Cloudflare receipt to the build
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          node scripts/release-identity.mjs finalize
          --prepared outputs/release/prepared-build.json
          --wrangler-output "${{ runner.temp }}/wrangler-output.ndjson"
          --output outputs/release/release-receipt.json

      - name: Attest the immutable release receipt
        id: attest
        # actions/attest@v4 is pinned to an immutable upstream commit.
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: outputs/release/release-receipt.json

      - name: Add receipt checksum for submission handoff
        shell: bash
        run: sha256sum outputs/release/release-receipt.json > outputs/release/release-receipt.sha256

      - name: Preserve receipt, canonical manifests, and Sigstore bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-release-${{ github.sha }}
          path: |
            outputs/release/
            ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 90

      - name: Preserve pre-deploy browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-production-release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
